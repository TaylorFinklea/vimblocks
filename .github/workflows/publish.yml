name: Publish Vimblocks

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    # Pinned rather than floating: the release build should not change because
    # a runner image or toolchain moved underneath it.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.0"
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check
        run: pnpm check
      - name: Test
        run: pnpm test
      - name: Package
        run: pnpm package
      - name: Record artifact digest
        run: |
          shasum -a 256 release/vimblocks-*.zip | tee release/SHA256SUMS.txt
          unzip -l release/vimblocks-*.zip
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Draft, not published. Download the asset, verify it against the
          # digest above, install that exact extraction, and smoke it before
          # publishing the draft by hand. A published release cannot be
          # unpublished from users who already fetched it.
          gh release create "$TAG" \
            release/vimblocks-*.zip release/SHA256SUMS.txt \
            --title "Vimblocks $TAG" \
            --generate-notes \
            --draft
